[package]
name = "rustudio-launcher"
description = "Spawns the unmodified rustudio player for a self-contained game bundle"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately no rustudio-* dependencies (FORK-PLAN §2.2, §3): engine API
# changes must never reach the launcher.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# The native error box: a windowless build has no console to print to.
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
